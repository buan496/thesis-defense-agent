---
name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality-gate:
    name: Offline tests and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEEPSEEK_API_KEY: offline-ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Prepare report directory
        run: mkdir -p data/reports

      - name: Run offline tests
        run: uv run --frozen pytest --junitxml=data/reports/pytest.xml

      - name: Run offline regression quality gate
        run: |
          baseline="tests/fixtures/evaluation_reports/faithfulness_baseline.json"
          current="tests/fixtures/evaluation_reports/faithfulness_current.json"
          uv run --frozen python -m app.cli compare-evaluation-reports \
            --baseline "$baseline" \
            --current "$current" \
            --metric-tolerance 0.0 \
            --fail-on-regression \
            --output data/reports/offline_regression.json \
            --markdown-output data/reports/offline_regression.md

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-quality-reports
          path: data/reports/
          if-no-files-found: warn
          retention-days: 14
