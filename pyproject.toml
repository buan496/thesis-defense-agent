[project]
name = "thesis-defense-agent"
version = "0.1.0"
description = "论文答辩训练agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.38.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]