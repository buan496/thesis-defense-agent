[project]
name = "thesis-defense-agent"
version = "0.1.0"
description = "论文答辩训练agent"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    "langgraph>=1.2.6",
    "openai>=2.38.0",
    "psycopg[binary]>=3.3.2",
    "pymilvus>=2.5.0",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.18.0",
    "requests>=2.34.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
