global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "thesis-defense-agent-api"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets:
          - "api:8000"
